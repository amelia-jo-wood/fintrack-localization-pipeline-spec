# Crowdin integration configuration for String-Based Projects
project_id: 'fintrack-core-continuous'
api_token_env: 'CROWDIN_API_TOKEN'
base_path: '.'

# Define which files contain the strings to pull
files:
  - source: /locales/en_UI.json
    translation: /locales/%locale_id%/%original_file_name%
  - source: /locales/en_alerts.json
    translation: /locales/%locale_id%/%original_file_name%
